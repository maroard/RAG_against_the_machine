[project]
name = "RAG_against_the_machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation, that’s it. That’s the goal of this project."
requires-python = ">=3.10"
dependencies = [
    # "tuiloom==0.12.0",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.11",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

